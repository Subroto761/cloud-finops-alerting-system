global:
  scrape_interval: 60s
  evaluation_interval: 60s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: finops-exporter
    static_configs:
      - targets: ["finops-exporter:9108"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
