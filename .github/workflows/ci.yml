name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false
      - run: terraform validate

  monitoring:
    name: Prometheus config and alert-rule tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus" --entrypoint promtool \
            prom/prometheus:v2.53.2 check config /etc/prometheus/prometheus.yml
      - name: Unit-test alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/prometheus" -w /etc/prometheus --entrypoint promtool \
            prom/prometheus:v2.53.2 test rules alert_rules_test.yml
      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/monitoring:/cfg" --entrypoint amtool \
            prom/alertmanager:v0.27.0 check-config /cfg/alertmanager.yml

  stack:
    name: End-to-end demo stack
    runs-on: ubuntu-latest
    needs: [python, monitoring]
    steps:
      - uses: actions/checkout@v4
      - name: Start stack in demo mode
        run: |
          mkdir -p ~/.aws
          docker compose up -d --build
      - name: Exporter serves metrics
        run: |
          for i in $(seq 1 30); do curl -fs localhost:9108/metrics | grep -q '^finops_daily_cost_usd' && break; sleep 2; done
          curl -fs localhost:9108/metrics | grep '^finops_'
      - name: Prometheus scrapes the exporter and loaded the rules
        run: |
          for i in $(seq 1 30); do
            curl -fsG localhost:9090/api/v1/query --data-urlencode 'query=up{job="finops-exporter"}' | grep -q '"value":\[[0-9.]*,"1"\]' && break
            sleep 3
          done
          curl -fsG localhost:9090/api/v1/query --data-urlencode 'query=up{job="finops-exporter"}' | grep -q '"1"'
          curl -fs localhost:9090/api/v1/rules | grep -q CostSpike
      - name: CostSpike alert becomes pending on demo data
        run: |
          for i in $(seq 1 40); do
            curl -fs localhost:9090/api/v1/alerts | grep -q '"alertname":"CostSpike"' && exit 0
            sleep 3
          done
          curl -fs localhost:9090/api/v1/alerts; exit 1
      - name: Grafana is up with the dashboard provisioned
        run: |
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 2; done
          curl -fs -u admin:admin 'localhost:3000/api/search?query=FinOps' | grep -q finops-overview
      - if: failure()
        run: docker compose logs
